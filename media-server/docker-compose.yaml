services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: 1000:1000
    network_mode: container:vpn
    volumes:
      - ./services/jellyfin/config:/config
      - ./services/jellyfin/cache:/cache
      - nas_media:/data/media
      # Optional - extra fonts to be used during transcoding with subtitle burn-in
      #- type: bind
      #  source: /path/to/fonts
      #  target: /usr/local/share/fonts/custom
      #  read_only: true
    # Optional - alternative address used for autodiscovery
    #environment:
    #  - JELLYFIN_PublishedServerUrl=http://192.168.1.200/
    #ports:
    #  - ${JELLYFIN_PORT}:${JELLYFIN_PORT}
    restart: unless-stopped
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    #extra_hosts:
    #  - 'host.docker.internal:host-gateway'

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: container:vpn
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIME_ZONE}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
      - TORRENTING_PORT=${QBITTORRENT_TORRENTING_PORT}
    volumes:
      - ./services/qbittorrent/appdata:/config
      - nas_torrents:/data/torrents
    #ports:
    #  - ${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}
    #  - ${QBITTORRENT_TORRENTING_PORT}:${QBITTORRENT_TORRENTING_PORT}
    #  - ${QBITTORRENT_TORRENTING_PORT}:${QBITTORRENT_TORRENTING_PORT}/udp
    restart: unless-stopped

  nzbget:
    image: nzbgetcom/nzbget:latest
    container_name: nzbget
    network_mode: container:vpn
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIME_ZONE}
      - NZBGET_USER=${NZBGET_USER} #optional
      - NZBGET_PASS=${NZBGET_PASS} #optional
    volumes:
      - ./services/nzbget/config:/config
      - nas_usenet:/data/usenet
    #ports:
    #  - ${NZBGET_PORT}:${NZBGET_PORT}
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    network_mode: container:vpn
    environment:
      - LOG_LEVEL=debug
      - TZ=${TIME_ZONE}
      - PORT=${JELLYSEERR_PORT}
    #ports:
    #  - ${JELLYSEERR_PORT}:${JELLYSEERR_PORT}
    volumes:
      - ./services/jellyseerr/appdata/config:/app/config
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: container:vpn
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIME_ZONE}
    volumes:
      - ./services/sonarr/data:/config
      - nas_data:/data
    #ports:
    #  - ${SONARR_PORT}:${SONARR_PORT}
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: container:vpn
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIME_ZONE}
    volumes:
      - ./services/radarr/data:/config
      - nas_data:/data
    #ports:
    #  - ${RADARR_PORT}:${RADARR_PORT}
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    network_mode: container:vpn
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIME_ZONE}
    volumes:
      - ./services/lidarr/config:/config
      - nas_data:/data
    #ports:
    #  - ${LIDARR_PORT}:${LIDARR_PORT}
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    network_mode: container:vpn
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIME_ZONE}
    volumes:
      - ./services/bazarr/config:/config
      - nas_media:/data/media
    #ports:
    #  - ${BAZARR_PORT}:${BAZARR_PORT}
    restart: unless-stopped

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    user: 1000:1000
    volumes:
      - ./services/recyclarr:/config
    environment:
      - TZ=${TIME_ZONE}
      - RECYCLARR_CREATE_CONFIG=true
      - RADARR_BASE_URL=${RADARR_BASE_URL}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_BASE_URL=${SONARR_BASE_URL}
      - SONARR_API_KEY=${SONARR_API_KEY}
    network_mode: container:vpn
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: container:vpn
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIME_ZONE}
    volumes:
      - ./services/prowlarr/data:/config
    #ports:
    #  - 9696:9696
    restart: unless-stopped

  flaresolverr:
    # DockerHub mirror flaresolverr/flaresolverr:latest
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: container:vpn
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TIME_ZONE}
    #ports:
    #  - "${PORT:-8191}:8191"
    restart: unless-stopped

volumes:
  nas_data:
    driver: local
    driver_opts:
      type: cifs
      o: "username=leo,uid=1000,gid=1000"
      device: "//127.0.0.1/shared/data"
  nas_media:
    driver: local
    driver_opts:
      type: cifs
      o: "username=leo,uid=1000,gid=1000"
      device: "//127.0.0.1/shared/data/media"
  nas_torrents:
    driver: local
    driver_opts:
      type: cifs
      o: "username=leo,uid=1000,gid=1000"
      device: "//127.0.0.1/shared/data/torrents"
  nas_usenet:
    driver: local
    driver_opts:
      type: cifs
      o: "username=leo,uid=1000,gid=1000"
      device: "//127.0.0.1/shared/data/usenet"
