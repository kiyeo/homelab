services:
  vpn:
    image: tailscale/tailscale:v1.98.10
    container_name: vpn
    restart: unless-stopped
    hostname: media-server
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      - 80:80
      - 81:81
      - 443:443
      - ${UNBOUND_PORT}:${UNBOUND_PORT}
      - ${SEERR_PORT}:${SEERR_PORT}
      - ${JELLYFIN_PORT}:${JELLYFIN_PORT}
      - ${PIHOLE_WEBSERVER_PORT}:${PIHOLE_WEBSERVER_PORT}
      - ${PROWLARR_PORT}:${PROWLARR_PORT}
    volumes:
      - ./tailscale/data:/var/lib/tailscale
    cap_add:
      - net_admin
    healthcheck:
      test: tailscale status --peers=false --json | grep -q 'Online.*true'
      interval: 15s
      timeout: 3s
      retries: 5
