services:
  vaultwarden-ts:
    image: tailscale/tailscale:v1.96.5
    container_name: vaultwarden-ts
    restart: unless-stopped
    hostname: vaultwarden
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
    ports:
      - 127.0.0.1:8081:8081 # vaultwarden
    volumes:
      - ./tailscale/data:/var/lib/tailscale
      - ./tailscale/config:/config
    cap_add:
      - net_admin
    healthcheck:
      test: tailscale status --peers=false --json | grep -q 'Online.*true'
      interval: 15s
      timeout: 3s
      retries: 5
  vaultwarden:
    image: ghcr.io/dani-garcia/vaultwarden:1.36.0
    container_name: vaultwarden
    network_mode: service:vaultwarden-ts
    depends_on:
      vaultwarden-ts:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    secrets:
      - vaultwardenconfig
    environment:
      ENV_FILE: /run/secrets/vaultwardenconfig
      CONFIG_FILE: /dev/null
      ROCKET_PORT:
    volumes:
      - ./vaultwarden/data:/data
    #ports:
    #  - 127.0.0.1:8000:80

secrets:
  vaultwardenconfig:
    file: ./.env
